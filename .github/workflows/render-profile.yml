name: Render Profile (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and decode source APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download am-2 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --clobber
          APK="$(find . -maxdepth 1 -name '*.apk' -print -quit)"
          java -jar /usr/local/bin/apktool.jar d -r -f -o decoded "$APK" || {
            curl -sSLf -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
            java -jar /tmp/apktool.jar d -r -f -o decoded "$APK"
          }

      - name: List render-related classes
        shell: bash
        run: |
          find decoded -type f -path '*/smali*/*.smali' |
            sed 's#^decoded/##' |
            grep -Ei '(ScenePlayer|SceneKt|GLContext|Preview|Render|Resolution|Quality|Frame|Viewport)' |
            sort | head -1200

      - name: Find preview resolution and quality controls
        shell: bash
        run: |
          grep -RInaE --include='*.smali' \
            '(Preview|preview).{0,60}(Scale|scale|Resolution|resolution|Quality|quality|Size|size|Width|width|Height|height)|(Scale|scale|Resolution|resolution|Quality|quality|Size|size|Width|width|Height|height).{0,60}(Preview|preview)|setViewport|glViewport|renderScale|PreviewScale|previewQuality' \
            decoded/smali* | head -2500

      - name: Inspect native preview player
        shell: bash
        run: |
          for NAME in \
            'ScenePlayer.smali' \
            'ScenePlayer$2.smali' \
            'ScenePlayer$renderFrame$2.smali' \
            'GLContext.smali' \
            'SceneKt.smali' \
            'EditActivity.smali'; do
            FILE="$(find decoded -type f -name "$NAME" -print -quit)"
            echo "===== $NAME :: $FILE ====="
            if [ -n "$FILE" ]; then sed -n '1,2600p' "$FILE"; fi
          done

      - name: Inspect method signatures
        shell: bash
        run: |
          find decoded -type f -path '*/smali*/*.smali' |
            grep -Ei '(ScenePlayer|SceneKt|GLContext|Preview|Render|Resolution|Quality)' |
            while IFS= read -r file; do
              grep -HnE '^\.method|^\.field' "$file"
            done | head -5000
