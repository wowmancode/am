name: Emulator smoke test

# Installs the latest custom APK on an Android emulator, launches it and
# records screenshots and logs to the "<release>-custom-test" release.
# Runs after every successful build, or by hand.

on:
  workflow_run:
    workflows: ["Build Custom Alight Motion APK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release:
        description: "Release that holds Alight.Motion.Custom.apk"
        required: false
        default: "am-2-custom"
      steps:
        description: "Optional UI steps script under .github/emulator-steps/"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.release || 'am-2-custom' }}
      STEPS: ${{ inputs.steps || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" --pattern Alight.Motion.Custom.apk --dir . --clobber
          ls -lh Alight.Motion.Custom.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # x86_64 images from Android 11 on translate ARM code, which this APK
      # needs (it ships arm64-v8a and armeabi-v7a only). The Play Store
      # image is required: the app crashes at launch without Play billing.
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: playstore
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/emulator-smoke.sh Alight.Motion.Custom.apk emulator-out "${{ env.STEPS && format('.github/emulator-steps/{0}', env.STEPS) || '' }}"

      - name: Publish screenshots and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d emulator-out ] || exit 0
          TAG="${RELEASE}-test"
          tar -czf emulator-out.tar.gz emulator-out
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Emulator screenshots and logs" --prerelease
          gh release upload "$TAG" emulator-out.tar.gz --clobber
