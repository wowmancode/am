name: Build Side-by-Side Alight Motion Split Set

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patch/effects/**"
      - ".github/workflows/build-patched-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original APK splits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "base.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.arm64_v8a.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.en.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.xxhdpi.apk" \
            --clobber

          echo "=== INPUT APKS ==="
          ls -lh *.apk

      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            zip \
            curl \
            openjdk-17-jdk

          curl -L --fail \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

          java -jar apktool.jar --version

      - name: Decode base APK
        run: |
          set -e

          java -jar apktool.jar d \
            -f \
            base.apk \
            -o decoded-base

      - name: Decode split manifests
        run: |
          set -e

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.arm64_v8a.apk \
            -o decoded-arm64

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.en.apk \
            -o decoded-en

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.xxhdpi.apk \
            -o decoded-xxhdpi

          echo "=== SPLIT MANIFEST FILE TYPES ==="

          file \
            decoded-arm64/AndroidManifest.xml \
            decoded-en/AndroidManifest.xml \
            decoded-xxhdpi/AndroidManifest.xml

      - name: Rename base package
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          manifest_path = Path("decoded-base/AndroidManifest.xml")

          android_ns = "http://schemas.android.com/apk/res/android"

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          name_attr = f"{{{android_ns}}}name"
          target_attr = f"{{{android_ns}}}targetActivity"

          component_tags = {
              "activity",
              "activity-alias",
              "service",
              "receiver",
              "provider",
              "application",
              "instrumentation",
          }

          changed_names = 0

          for elem in root.iter():
              tag = elem.tag.split("}")[-1]

              if tag not in component_tags:
                  continue

              if name_attr in elem.attrib:
                  value = elem.attrib[name_attr]

                  if value.startswith("."):
                      elem.attrib[name_attr] = OLD + value
                      changed_names += 1

              if target_attr in elem.attrib:
                  value = elem.attrib[target_attr]

                  if value.startswith("."):
                      elem.attrib[target_attr] = OLD + value
                      changed_names += 1

          ET.register_namespace(
              "android",
              android_ns
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          text = manifest_path.read_text(
              encoding="utf-8"
          )

          text, count = re.subn(
              r'\bpackage="' + re.escape(OLD) + r'"',
              f'package="{NEW}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: base package rename failed"
              )

          text = re.sub(
              r'(<application\b[^>]*?\bandroid:label=)"[^"]*"',
              r'\1"Alight Motion Custom"',
              text,
              count=1
          )

          text = text.replace(
              "com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              "com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          )

          text = text.replace(
              "com.alightcreative.app.motion.fileprovider",
              "com.alightcreative.app.motion.personal.fileprovider"
          )

          manifest_path.write_text(
              text,
              encoding="utf-8"
          )

          replacements = {
              '"com.alightcreative.motion"':
                  '"com.alightcreative.motion.personal"',

              '"com.alightcreative.app.motion.fileprovider"':
                  '"com.alightcreative.app.motion.personal.fileprovider"',

              '"com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"':
                  '"com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"',
          }

          changed_smali = 0

          for root_dir in Path("decoded-base").glob("smali*"):

              if not root_dir.is_dir():
                  continue

              for path in root_dir.rglob("*.smali"):

                  try:
                      old_text = path.read_text(
                          encoding="utf-8"
                      )
                  except UnicodeDecodeError:
                      continue

                  new_text = old_text

                  for old, new in replacements.items():
                      new_text = new_text.replace(
                          old,
                          new
                      )

                  if new_text != old_text:
                      path.write_text(
                          new_text,
                          encoding="utf-8"
                      )
                      changed_smali += 1

          print(
              "Relative component names converted:",
              changed_names
          )

          print(
              "Smali files changed:",
              changed_smali
          )

          final = manifest_path.read_text(
              encoding="utf-8"
          )

          m = re.search(
              r'\bpackage="([^"]+)"',
              final
          )

          if not m:
              raise SystemExit(
                  "ERROR: base package missing"
              )

          print(
              "Final base package:",
              m.group(1)
          )

          if m.group(1) != NEW:
              raise SystemExit(
                  "ERROR: base package incorrect"
              )

          PY

      - name: Rename split manifest packages
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          split_dirs = [
              Path("decoded-arm64"),
              Path("decoded-en"),
              Path("decoded-xxhdpi"),
          ]

          for directory in split_dirs:

              manifest = directory / "AndroidManifest.xml"

              raw = manifest.read_bytes()

              print()
              print(
                  "Manifest:",
                  manifest
              )

              print(
                  "First bytes:",
                  raw[:16]
              )

              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError as e:
                  raise SystemExit(
                      f"ERROR: {manifest} is still binary XML: {e}"
                  )

              package_match = re.search(
                  r'\bpackage="([^"]+)"',
                  text
              )

              split_match = re.search(
                  r'\bsplit="([^"]+)"',
                  text
              )

              print(
                  "Original package:",
                  package_match.group(1)
                  if package_match
                  else "NOT FOUND"
              )

              print(
                  "Split name:",
                  split_match.group(1)
                  if split_match
                  else "NOT FOUND"
              )

              if not package_match:
                  raise SystemExit(
                      f"ERROR: package missing in {manifest}"
                  )

              if not split_match:
                  raise SystemExit(
                      f"ERROR: split identity missing in {manifest}"
                  )

              original_split = split_match.group(1)

              text, count = re.subn(
                  r'\bpackage="' +
                  re.escape(OLD) +
                  r'"',
                  f'package="{NEW}"',
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: failed to rename package in {manifest}"
                  )

              text = text.replace(
                  "com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
                  "com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
              )

              text = text.replace(
                  "com.alightcreative.app.motion.fileprovider",
                  "com.alightcreative.app.motion.personal.fileprovider"
              )

              manifest.write_text(
                  text,
                  encoding="utf-8"
              )

              final = manifest.read_text(
                  encoding="utf-8"
              )

              package_match = re.search(
                  r'\bpackage="([^"]+)"',
                  final
              )

              split_match = re.search(
                  r'\bsplit="([^"]+)"',
                  final
              )

              if (
                  not package_match
                  or package_match.group(1) != NEW
              ):
                  raise SystemExit(
                      f"ERROR: wrong package in {manifest}"
                  )

              if (
                  not split_match
                  or split_match.group(1) != original_split
              ):
                  raise SystemExit(
                      f"ERROR: split identity changed in {manifest}"
                  )

              print(
                  "New package:",
                  package_match.group(1)
              )

              print(
                  "Preserved split:",
                  split_match.group(1)
              )

          PY

      - name: Add custom effects
        run: |
          set -e

          test -f \
            patch/effects/invert-flash.xml

          test -f \
            patch/effects/gradient-map.xml

          test -f \
            patch/effects/tv-simulator.xml

          cp \
            patch/effects/invert-flash.xml \
            decoded-base/assets/effects/invert-flash.xml

          cp \
            patch/effects/gradient-map.xml \
            decoded-base/assets/effects/gradient-map.xml

          cp \
            patch/effects/tv-simulator.xml \
            decoded-base/assets/effects/tv-simulator.xml

      - name: Build cloned base
        run: |
          set -e

          java -jar apktool.jar b \
            decoded-base \
            -o base-custom-unsigned.apk

      - name: Rebuild split APKs with new manifests
        shell: bash
        run: |
          set -e

          mkdir -p split-work

          rebuild_split () {
            ORIGINAL="$1"
            MANIFEST="$2"
            OUTPUT="$3"
            WORK="$4"

            rm -rf "$WORK"

            mkdir -p "$WORK"

            unzip -q \
              "$ORIGINAL" \
              -d "$WORK"

            rm -rf \
              "$WORK/META-INF"

            cp \
              "$MANIFEST" \
              "$WORK/AndroidManifest.xml"

            (
              cd "$WORK"

              zip \
                -q \
                -r \
                "../../$OUTPUT" \
                .
            )
          }

          rebuild_split \
            split_config.arm64_v8a.apk \
            decoded-arm64/AndroidManifest.xml \
            arm64-custom-unsigned.apk \
            split-work/arm64

          rebuild_split \
            split_config.en.apk \
            decoded-en/AndroidManifest.xml \
            en-custom-unsigned.apk \
            split-work/en

          rebuild_split \
            split_config.xxhdpi.apk \
            decoded-xxhdpi/AndroidManifest.xml \
            xxhdpi-custom-unsigned.apk \
            split-work/xxhdpi

          ls -lh \
            *custom-unsigned.apk

      - name: Create signing key
        run: |
          set -e

          keytool \
            -genkeypair \
            -keystore patch.keystore \
            -storepass android \
            -keypass android \
            -alias patch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Personal Patch"

      - name: Align and sign all APKs
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          mkdir -p output

          align_sign () {
            INPUT="$1"
            ALIGNED="$2"
            OUTPUT="$3"

            "$BUILD_TOOLS/zipalign" \
              -f \
              -P 16 \
              4 \
              "$INPUT" \
              "$ALIGNED"

            "$BUILD_TOOLS/apksigner" sign \
              --ks patch.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUTPUT" \
              "$ALIGNED"

            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              --print-certs \
              "$OUTPUT"

            "$BUILD_TOOLS/zipalign" \
              -c \
              -P 16 \
              -v \
              4 \
              "$OUTPUT"
          }

          align_sign \
            base-custom-unsigned.apk \
            output/base-aligned.apk \
            output/base.apk

          align_sign \
            arm64-custom-unsigned.apk \
            output/arm64-aligned.apk \
            output/split_config.arm64_v8a.apk

          align_sign \
            en-custom-unsigned.apk \
            output/en-aligned.apk \
            output/split_config.en.apk

          align_sign \
            xxhdpi-custom-unsigned.apk \
            output/xxhdpi-aligned.apk \
            output/split_config.xxhdpi.apk

      - name: Verify package identities
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          EXPECTED="com.alightcreative.motion.personal"

          for APK in \
            output/base.apk \
            output/split_config.arm64_v8a.apk \
            output/split_config.en.apk \
            output/split_config.xxhdpi.apk
          do

            echo
            echo "===== $APK ====="

            "$BUILD_TOOLS/aapt2" \
              dump badging \
              "$APK" |
              head -20

            PACKAGE="$(
              "$BUILD_TOOLS/aapt2" \
                dump badging \
                "$APK" |
              sed -n \
                "s/^package: name='\([^']*\)'.*/\1/p" |
              head -1
            )"

            echo
            echo "Detected package: $PACKAGE"

            if [ "$PACKAGE" != "$EXPECTED" ]; then
              echo "ERROR: package mismatch in $APK"
              exit 1
            fi

          done

      - name: Verify split identities
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          for APK in \
            output/split_config.arm64_v8a.apk \
            output/split_config.en.apk \
            output/split_config.xxhdpi.apk
          do

            echo
            echo "===== $APK ====="

            "$BUILD_TOOLS/aapt2" \
              dump xmltree \
              "$APK" \
              AndroidManifest.xml |
              head -80

          done

      - name: Verify custom effects
        run: |
          set -e

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/invert-flash.xml'

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/gradient-map.xml'

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/tv-simulator.xml'

      - name: Create install script
        run: |
          cat > output/install.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash

          set -e

          cd "$(dirname "$0")"

          adb install-multiple \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk
          EOF

          chmod +x \
            output/install.sh

      - name: Create bundle
        run: |
          set -e

          cd output

          zip \
            -9 \
            Alight.Motion.Custom.split-set.zip \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            install.sh

          sha256sum \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            Alight.Motion.Custom.split-set.zip

      - name: Upload split set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alight-motion-custom-split-set
          path: |
            output/base.apk
            output/split_config.arm64_v8a.apk
            output/split_config.en.apk
            output/split_config.xxhdpi.apk
            output/install.sh
            output/Alight.Motion.Custom.split-set.zip
          retention-days: 3
