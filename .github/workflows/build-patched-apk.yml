name: Build Side-by-Side Alight Motion Split Set

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patch/effects/**"
      - ".github/workflows/build-patched-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original split APK set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "base.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.arm64_v8a.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.en.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.xxhdpi.apk" \
            --clobber

          ls -lh *.apk

      - name: Install tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            zip \
            curl \
            openjdk-17-jdk

          curl -L --fail \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

          java -jar apktool.jar --version

      - name: Decode base APK
        run: |
          java -jar apktool.jar d \
            -f \
            base.apk \
            -o decoded-base

      - name: Configure cloned package
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          manifest_path = Path("decoded-base/AndroidManifest.xml")

          android_ns = "http://schemas.android.com/apk/res/android"

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          name_attr = f"{{{android_ns}}}name"
          target_attr = f"{{{android_ns}}}targetActivity"

          component_tags = {
              "activity",
              "activity-alias",
              "service",
              "receiver",
              "provider",
              "application",
              "instrumentation",
          }

          changed = 0

          for elem in root.iter():
              tag = elem.tag.split("}")[-1]

              if tag not in component_tags:
                  continue

              if name_attr in elem.attrib:
                  value = elem.attrib[name_attr]

                  if value.startswith("."):
                      elem.attrib[name_attr] = OLD + value
                      changed += 1

              if target_attr in elem.attrib:
                  value = elem.attrib[target_attr]

                  if value.startswith("."):
                      elem.attrib[target_attr] = OLD + value
                      changed += 1

          ET.register_namespace(
              "android",
              android_ns
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              "Relative component names converted:",
              changed
          )

          text = manifest_path.read_text()

          text, count = re.subn(
              r'\bpackage="' + re.escape(OLD) + r'"',
              f'package="{NEW}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: manifest package rename failed"
              )

          text = re.sub(
              r'(<application\b[^>]*?\bandroid:label=)"[^"]*"',
              r'\1"Alight Motion Custom"',
              text,
              count=1
          )

          text = text.replace(
              "com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              "com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          )

          text = text.replace(
              "com.alightcreative.app.motion.fileprovider",
              "com.alightcreative.app.motion.personal.fileprovider"
          )

          manifest_path.write_text(text)

          replacements = {
              '"com.alightcreative.motion"':
                  '"com.alightcreative.motion.personal"',

              '"com.alightcreative.app.motion.fileprovider"':
                  '"com.alightcreative.app.motion.personal.fileprovider"',

              '"com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"':
                  '"com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"',
          }

          changed_smali = 0

          for root_dir in Path("decoded-base").glob("smali*"):

              if not root_dir.is_dir():
                  continue

              for path in root_dir.rglob("*.smali"):

                  try:
                      old_text = path.read_text()
                  except UnicodeDecodeError:
                      continue

                  new_text = old_text

                  for old, new in replacements.items():
                      new_text = new_text.replace(
                          old,
                          new
                      )

                  if new_text != old_text:
                      path.write_text(new_text)
                      changed_smali += 1

          print(
              "Smali identity strings changed in files:",
              changed_smali
          )

          PY

          grep -o \
            'package="[^"]*"' \
            decoded-base/AndroidManifest.xml |
            head -1

      - name: Add custom effects
        run: |
          set -e

          cp \
            patch/effects/invert-flash.xml \
            decoded-base/assets/effects/invert-flash.xml

          cp \
            patch/effects/gradient-map.xml \
            decoded-base/assets/effects/gradient-map.xml

          cp \
            patch/effects/tv-simulator.xml \
            decoded-base/assets/effects/tv-simulator.xml

      - name: Build cloned base APK
        run: |
          java -jar apktool.jar b \
            decoded-base \
            -o base-custom-unsigned.apk

      - name: Prepare signing key
        run: |
          keytool \
            -genkeypair \
            -keystore patch.keystore \
            -storepass android \
            -keypass android \
            -alias patch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Personal Patch"

      - name: Sign all four APKs
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          mkdir -p output

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            base-custom-unsigned.apk \
            output/base-custom-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks patch.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/base.apk \
            output/base-custom-aligned.apk

          for APK in \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk
          do

            NAME="$(basename "$APK")"

            "$BUILD_TOOLS/zipalign" \
              -f \
              -p \
              4 \
              "$APK" \
              "output/aligned-$NAME"

            "$BUILD_TOOLS/apksigner" sign \
              --ks patch.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "output/$NAME" \
              "output/aligned-$NAME"

          done

      - name: Verify APK signatures
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          for APK in \
            output/base.apk \
            output/split_config.arm64_v8a.apk \
            output/split_config.en.apk \
            output/split_config.xxhdpi.apk
          do

            echo
            echo "===== $APK ====="

            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              --print-certs \
              "$APK"

          done

      - name: Verify cloned base package
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          echo
          echo "=== BASE PACKAGE INFO ==="

          "$BUILD_TOOLS/aapt2" \
            dump badging \
            output/base.apk |
            head -40

          PACKAGE="$(
            "$BUILD_TOOLS/aapt2" \
              dump badging \
              output/base.apk |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo
          echo "Detected package: $PACKAGE"

          test \
            "$PACKAGE" = \
            "com.alightcreative.motion.personal"

          echo
          echo "=== CUSTOM EFFECTS ==="

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/invert-flash.xml'

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/gradient-map.xml'

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/tv-simulator.xml'

      - name: Create install bundle
        run: |
          cp \
            output/base.apk \
            output/Alight.Motion.Custom.base.apk

          cd output

          zip \
            -9 \
            Alight.Motion.Custom.split-set.zip \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk

          sha256sum \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            Alight.Motion.Custom.split-set.zip

      - name: Upload split set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alight-motion-custom-split-set
          path: |
            output/base.apk
            output/split_config.arm64_v8a.apk
            output/split_config.en.apk
            output/split_config.xxhdpi.apk
            output/Alight.Motion.Custom.split-set.zip
          retention-days: 3
