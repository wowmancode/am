name: Build Custom Alight Motion APK

# Takes the Morphe-patched Alight Motion APK from a private release (am-2 by
# default), adds the custom effects from patch/effects/, then aligns and signs
# it with the persistent clone key, then publishes it to the "<release>-custom"
# release (e.g. am-2-custom).
#
# The Morphe-patched APK is already a side-by-side clone (its package is
# com.alightcreative.motion.morphe), so nothing is renamed here.

on:
  workflow_dispatch:
    inputs:
      source_release:
        description: "Release tag that holds the Morphe-patched Alight_Motion-*.apk"
        required: false
        default: "am-2"
  push:
    branches:
      - main
    paths:
      - "patch/effects/**"
      - ".github/scripts/**"
      - ".github/workflows/build-patched-apk.yml"

permissions:
  contents: write

env:
  SOURCE_RELEASE: ${{ inputs.source_release || 'am-2' }}
  ORIGINAL_PACKAGE: com.alightcreative.motion

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A shader that doesn't compile only fails once the app runs, so
      # compile every custom effect exactly the way the app assembles it.
      - name: Compile effect shaders
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools >/dev/null
          python3 .github/scripts/check-shaders.py patch/effects/*.xml

      - name: Download Morphe-patched APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p source

          gh release download "$SOURCE_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Alight_Motion-*.apk" \
            --dir source \
            --clobber

          COUNT="$(find source -maxdepth 1 -type f -name '*.apk' | wc -l)"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one Alight_Motion-*.apk in release $SOURCE_RELEASE, found $COUNT" >&2
            ls -l source >&2
            exit 1
          fi

          mv source/*.apk source.apk
          rmdir source

          ls -lh source.apk

      - name: Locate Android build tools and read source metadata
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "${ANDROID_HOME:-/nonexistent}/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::No Android build-tools found under ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            exit 1
          fi

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Build tools: $BUILD_TOOLS"

          export BUILD_TOOLS
          .github/scripts/apk-info.sh source.apk SOURCE_ | tee source-info.env

          # shellcheck disable=SC1091
          . ./source-info.env

          # The whole point of the clone is to install next to the official
          # app. If the release holds an unpatched APK, stop here instead of
          # shipping something that would replace or conflict with it.
          if [ "$SOURCE_PACKAGE" = "$ORIGINAL_PACKAGE" ]; then
            echo "::error::source.apk still uses the original package $ORIGINAL_PACKAGE; expected a Morphe-patched clone"
            exit 1
          fi

          cat source-info.env >> "$GITHUB_ENV"

      # The app hashes all bundled effect XMLs at startup and compares the
      # result with a constant in its code. Adding effects changes the
      # hash, so the constant is updated to match the new effect set.
      - name: Compute effect integrity signature
        shell: bash
        run: |
          set -e
          python3 .github/scripts/add-effects.py sig source.apk patch/effects | tee sig.env
          cat sig.env >> "$GITHUB_ENV"

      - name: Rebuild DEX with updated signature
        shell: bash
        run: |
          set -e
          .github/scripts/rebuild-sig-dex.sh \
            source.apk "$OLD_EFFECT_SIG" "$NEW_EFFECT_SIG" rebuilt-dex |
            tee dex.env
          cat dex.env >> "$GITHUB_ENV"

      - name: Add custom effects
        shell: bash
        run: |
          set -e

          python3 .github/scripts/add-effects.py build \
            source.apk \
            custom-unsigned.apk \
            patch/effects \
            --dex "$DEX_NAME=rebuilt-dex/$DEX_NAME"

      - name: Prepare clone signing key
        env:
          PATCH_KEYSTORE_B64: ${{ secrets.PATCH_KEYSTORE_B64 }}
          PATCH_KEYSTORE_PASSWORD: ${{ secrets.PATCH_KEYSTORE_PASSWORD }}
          PATCH_KEY_PASSWORD: ${{ secrets.PATCH_KEY_PASSWORD }}
          PATCH_KEY_ALIAS: ${{ secrets.PATCH_KEY_ALIAS }}
        run: |
          set -e

          if [ -n "$PATCH_KEYSTORE_B64" ]; then
            echo "$PATCH_KEYSTORE_B64" | base64 -d > patch.keystore

            : "${PATCH_KEYSTORE_PASSWORD:?PATCH_KEYSTORE_PASSWORD secret is required when PATCH_KEYSTORE_B64 is set}"
            : "${PATCH_KEY_ALIAS:?PATCH_KEY_ALIAS secret is required when PATCH_KEYSTORE_B64 is set}"

            if [ -z "$PATCH_KEY_PASSWORD" ]; then
              PATCH_KEY_PASSWORD="$PATCH_KEYSTORE_PASSWORD"
            fi

            echo "Using persistent clone signing key from GitHub Secrets."
          else
            echo "::warning::No PATCH_KEYSTORE_B64 secret is configured. Generating an ephemeral key; builds signed this way cannot update one another without uninstalling the previous clone."

            PATCH_KEYSTORE_PASSWORD="android"
            PATCH_KEY_PASSWORD="android"
            PATCH_KEY_ALIAS="patch"

            keytool \
              -genkeypair \
              -keystore patch.keystore \
              -storepass "$PATCH_KEYSTORE_PASSWORD" \
              -keypass "$PATCH_KEY_PASSWORD" \
              -alias "$PATCH_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Alight Motion Personal Clone"
          fi

          echo "PATCH_KEYSTORE_PASSWORD=$PATCH_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PATCH_KEY_PASSWORD=$PATCH_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "PATCH_KEY_ALIAS=$PATCH_KEY_ALIAS" >> "$GITHUB_ENV"

          keytool -list \
            -keystore patch.keystore \
            -storepass "$PATCH_KEYSTORE_PASSWORD" \
            -alias "$PATCH_KEY_ALIAS"

      - name: Align and sign
        shell: bash
        run: |
          set -e

          mkdir -p output

          # Signature schemes v2/v3 need Android 7.0 (API 24). Only add the
          # older JAR signature when the app still supports earlier releases.
          if [ "$SOURCE_MIN_SDK" -lt 24 ]; then
            V1_SIGNING=true
          else
            V1_SIGNING=false
          fi

          echo "minSdkVersion: $SOURCE_MIN_SDK (v1 signing: $V1_SIGNING)"

          echo
          echo "=== ALIGNING ==="

          # -P 16 page-aligns stored native libraries, which the app needs
          # because it ships them uncompressed (extractNativeLibs=false).
          "$BUILD_TOOLS/zipalign" \
            -f \
            -P 16 \
            4 \
            custom-unsigned.apk \
            custom-aligned.apk

          echo
          echo "=== SIGNING ==="

          "$BUILD_TOOLS/apksigner" sign \
            --ks patch.keystore \
            --ks-key-alias "$PATCH_KEY_ALIAS" \
            --ks-pass "pass:$PATCH_KEYSTORE_PASSWORD" \
            --key-pass "pass:$PATCH_KEY_PASSWORD" \
            --min-sdk-version "$SOURCE_MIN_SDK" \
            --v1-signing-enabled "$V1_SIGNING" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out output/Alight.Motion.Custom.apk \
            custom-aligned.apk

          echo
          echo "=== VERIFYING SIGNATURE ==="

          "$BUILD_TOOLS/apksigner" verify \
            --min-sdk-version "$SOURCE_MIN_SDK" \
            --verbose \
            --print-certs \
            output/Alight.Motion.Custom.apk

          echo
          echo "=== VERIFYING ALIGNMENT ==="

          "$BUILD_TOOLS/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            output/Alight.Motion.Custom.apk |
            tail -5

      - name: Verify output
        shell: bash
        run: |
          set -e

          APK=output/Alight.Motion.Custom.apk

          export BUILD_TOOLS
          .github/scripts/apk-info.sh "$APK" OUTPUT_ | tee output-info.env
          . ./output-info.env

          PACKAGE="$OUTPUT_PACKAGE"
          VERSION_CODE="$OUTPUT_VERSION_CODE"

          echo "Package: $PACKAGE"
          echo "versionCode: $VERSION_CODE"

          if [ "$PACKAGE" != "$SOURCE_PACKAGE" ]; then
            echo "ERROR: package changed from $SOURCE_PACKAGE to $PACKAGE" >&2
            exit 1
          fi

          if [ "$PACKAGE" = "$ORIGINAL_PACKAGE" ]; then
            echo "ERROR: output uses the original package $ORIGINAL_PACKAGE" >&2
            exit 1
          fi

          if [ "$VERSION_CODE" != "$SOURCE_VERSION_CODE" ]; then
            echo "ERROR: versionCode changed from $SOURCE_VERSION_CODE to $VERSION_CODE" >&2
            exit 1
          fi

          echo
          echo "=== CUSTOM EFFECTS ==="

          for EFFECT in patch/effects/*.xml; do
            NAME="$(basename "$EFFECT")"

            unzip -l "$APK" | grep "assets/effects/$NAME"

            if ! cmp -s "$EFFECT" <(unzip -p "$APK" "assets/effects/$NAME"); then
              echo "ERROR: assets/effects/$NAME differs from $EFFECT" >&2
              exit 1
            fi
          done

          echo
          echo "=== NATIVE LIBRARIES ==="

          python3 - <<'PY'
          from zipfile import ZIP_STORED, ZipFile

          with ZipFile("output/Alight.Motion.Custom.apk") as archive:
              libraries = [
                  entry for entry in archive.infolist()
                  if entry.filename.startswith("lib/") and entry.filename.endswith(".so")
              ]

              if not libraries:
                  raise SystemExit("ERROR: no native libraries found")

              compressed = [
                  entry.filename for entry in libraries
                  if entry.compress_type != ZIP_STORED
              ]

              if compressed:
                  raise SystemExit(
                      "ERROR: compressed native libraries: " + ", ".join(compressed)
                  )

              print(f"{len(libraries)} stored native libraries")
          PY

      - name: Checksums
        run: |
          set -e

          cd output
          sha256sum Alight.Motion.Custom.apk | tee Alight.Motion.Custom.apk.sha256
          ls -lh

      # The APK goes to a release rather than an Actions artifact: artifact
      # storage is capped per account and a single build is ~90 MB.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="${SOURCE_RELEASE}-custom"

          NOTES="$(
            printf 'Custom build of release %s\n\n' "$SOURCE_RELEASE"
            printf 'Package: %s\nVersion: %s (%s)\n\n' \
              "$SOURCE_PACKAGE" "$SOURCE_VERSION_NAME" "$SOURCE_VERSION_CODE"
            printf 'Built by %s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'SHA-256:\n%s\n' "$(cat output/Alight.Motion.Custom.apk.sha256)"
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" \
            output/Alight.Motion.Custom.apk \
            output/Alight.Motion.Custom.apk.sha256 \
            --clobber

          echo "Published release $TAG"
