name: Build Side-by-Side Alight Motion Split Set

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patch/effects/**"
      - ".github/workflows/build-patched-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original APK split set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "base.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.arm64_v8a.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.en.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.xxhdpi.apk" \
            --clobber

          ls -lh *.apk

      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            curl \
            openjdk-17-jdk

          curl -L --fail \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

          java -jar apktool.jar --version

      - name: Locate Android build tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          PLATFORM="$(
            find "$ANDROID_HOME/platforms" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=$PLATFORM" >> "$GITHUB_ENV"

          echo "Build tools: $BUILD_TOOLS"
          echo "Platform: $PLATFORM"

          "$BUILD_TOOLS/aapt2" version

          BADGING="$("$BUILD_TOOLS/aapt2" dump badging base.apk)"

          BASE_VERSION_CODE="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" |
            head -1
          )"

          BASE_VERSION_NAME="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" |
            head -1
          )"

          BASE_MIN_SDK="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" |
            head -1
          )"

          BASE_TARGET_SDK="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" |
            head -1
          )"

          APK_ANALYZER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name apkanalyzer 2>/dev/null |
            sort -V |
            tail -1
          )"

          if [ -z "$BASE_MIN_SDK" ] && [ -n "$APK_ANALYZER" ]; then
            BASE_MIN_SDK="$(
              "$APK_ANALYZER" manifest min-sdk base.apk |
              tr -d '\r' |
              head -1
            )"
          fi

          if [ -z "$BASE_TARGET_SDK" ] && [ -n "$APK_ANALYZER" ]; then
            BASE_TARGET_SDK="$(
              "$APK_ANALYZER" manifest target-sdk base.apk |
              tr -d '\r' |
              head -1
            )"
          fi

          # Android treats an omitted targetSdkVersion as minSdkVersion.
          if [ -z "$BASE_TARGET_SDK" ]; then
            BASE_TARGET_SDK="$BASE_MIN_SDK"
          fi

          echo "Base versionCode: ${BASE_VERSION_CODE:-<missing>}"
          echo "Base versionName: ${BASE_VERSION_NAME:-<not set>}"
          echo "Base minSdkVersion: ${BASE_MIN_SDK:-<missing>}"
          echo "Base targetSdkVersion: ${BASE_TARGET_SDK:-<missing>}"

          if [ -z "$BASE_VERSION_CODE" ] || \
             [ -z "$BASE_MIN_SDK" ] || \
             [ -z "$BASE_TARGET_SDK" ]; then
            echo "ERROR: failed to read package metadata from base.apk" >&2
            exit 1
          fi

          echo "BASE_VERSION_CODE=$BASE_VERSION_CODE" >> "$GITHUB_ENV"
          echo "BASE_VERSION_NAME=$BASE_VERSION_NAME" >> "$GITHUB_ENV"
          echo "BASE_MIN_SDK=$BASE_MIN_SDK" >> "$GITHUB_ENV"
          echo "BASE_TARGET_SDK=$BASE_TARGET_SDK" >> "$GITHUB_ENV"

      - name: Decode base APK
        run: |
          set -e

          java -jar apktool.jar d \
            -f \
            base.apk \
            -o decoded-base

      - name: Decode split manifests
        run: |
          set -e

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.arm64_v8a.apk \
            -o decoded-arm64

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.en.apk \
            -o decoded-en

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.xxhdpi.apk \
            -o decoded-xxhdpi

          echo
          echo "=== DECODED SPLIT MANIFESTS ==="

          head -3 decoded-arm64/AndroidManifest.xml
          head -3 decoded-en/AndroidManifest.xml
          head -3 decoded-xxhdpi/AndroidManifest.xml

      - name: Rename base application package
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          manifest_path = Path("decoded-base/AndroidManifest.xml")

          android_ns = "http://schemas.android.com/apk/res/android"

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          name_attr = f"{{{android_ns}}}name"
          target_attr = f"{{{android_ns}}}targetActivity"
          authorities_attr = f"{{{android_ns}}}authorities"

          component_tags = {
              "activity",
              "activity-alias",
              "service",
              "receiver",
              "provider",
              "application",
              "instrumentation",
          }

          changed_names = 0
          authority_replacements = {}

          def rename_authority(authority):
              if authority == NEW or authority.startswith(NEW + "."):
                  return authority
              if authority == OLD or authority.startswith(OLD + "."):
                  return NEW + authority[len(OLD):]
              if authority == "com.alightcreative.app.motion.fileprovider":
                  return "com.alightcreative.app.motion.personal.fileprovider"
              return authority

          for elem in root.iter():

              tag = elem.tag.split("}")[-1]

              if tag not in component_tags:
                  continue

              if name_attr in elem.attrib:

                  value = elem.attrib[name_attr]

                  if value.startswith("."):
                      elem.attrib[name_attr] = OLD + value
                      changed_names += 1

              if target_attr in elem.attrib:

                  value = elem.attrib[target_attr]

                  if value.startswith("."):
                      elem.attrib[target_attr] = OLD + value
                      changed_names += 1

              if tag == "provider" and authorities_attr in elem.attrib:
                  old_authorities = elem.attrib[authorities_attr]
                  new_authorities = ";".join(
                      rename_authority(authority)
                      for authority in old_authorities.split(";")
                  )

                  if new_authorities != old_authorities:
                      for old_authority, new_authority in zip(
                          old_authorities.split(";"),
                          new_authorities.split(";"),
                      ):
                          if old_authority != new_authority:
                              authority_replacements[old_authority] = new_authority

                      elem.attrib[authorities_attr] = new_authorities

          ET.register_namespace(
              "android",
              android_ns
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          text = manifest_path.read_text(
              encoding="utf-8"
          )

          text, count = re.subn(
              r'\bpackage="' + re.escape(OLD) + r'"',
              f'package="{NEW}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: failed to rename base package"
              )

          text = re.sub(
              r'(<application\b[^>]*?\bandroid:label=)"[^"]*"',
              r'\1"Alight Motion Custom"',
              text,
              count=1
          )

          text = text.replace(
              "com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              "com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          )

          text = text.replace(
              "com.alightcreative.app.motion.fileprovider",
              "com.alightcreative.app.motion.personal.fileprovider"
          )

          manifest_path.write_text(
              text,
              encoding="utf-8"
          )

          replacements = {
              '"com.alightcreative.motion"':
                  '"com.alightcreative.motion.personal"',

              '"com.alightcreative.app.motion.fileprovider"':
                  '"com.alightcreative.app.motion.personal.fileprovider"',

              '"com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"':
                  '"com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"',
          }

          replacements.update({
              f'"{old_authority}"': f'"{new_authority}"'
              for old_authority, new_authority in authority_replacements.items()
          })

          changed_smali = 0

          for root_dir in Path("decoded-base").glob("smali*"):

              if not root_dir.is_dir():
                  continue

              for path in root_dir.rglob("*.smali"):

                  try:
                      old_text = path.read_text(
                          encoding="utf-8"
                      )
                  except UnicodeDecodeError:
                      continue

                  new_text = old_text

                  for old, new in replacements.items():
                      new_text = new_text.replace(
                          old,
                          new
                      )

                  if new_text != old_text:

                      path.write_text(
                          new_text,
                          encoding="utf-8"
                      )

                      changed_smali += 1

          print(
              "Relative manifest classes converted:",
              changed_names
          )

          print(
              "Smali literal files changed:",
              changed_smali
          )

          print(
              "Provider authorities renamed:",
              len(authority_replacements)
          )

          for old_authority, new_authority in sorted(authority_replacements.items()):
              print(
                  "Provider authority:",
                  old_authority,
                  "->",
                  new_authority
              )

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          conflicting_authorities = []

          for elem in root.iter():
              if elem.tag.split("}")[-1] != "provider":
                  continue

              for authority in elem.attrib.get(authorities_attr, "").split(";"):
                  in_old_namespace = (
                      authority == OLD
                      or authority.startswith(OLD + ".")
                  ) and not (
                      authority == NEW
                      or authority.startswith(NEW + ".")
                  )

                  if in_old_namespace or authority == "com.alightcreative.app.motion.fileprovider":
                      conflicting_authorities.append(authority)

          if conflicting_authorities:
              raise SystemExit(
                  "ERROR: conflicting provider authorities remain: "
                  + ", ".join(sorted(set(conflicting_authorities)))
              )

          m = re.search(
              r'\bpackage="([^"]+)"',
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "Base package:",
              m.group(1) if m else "NOT FOUND"
          )

          if not m or m.group(1) != NEW:
              raise SystemExit(
                  "ERROR: incorrect base package"
              )

          PY

      - name: Rename split packages
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          manifests = [
              Path(
                  "decoded-arm64/AndroidManifest.xml"
              ),
              Path(
                  "decoded-en/AndroidManifest.xml"
              ),
              Path(
                  "decoded-xxhdpi/AndroidManifest.xml"
              ),
          ]

          for manifest in manifests:

              text = manifest.read_text(
                  encoding="utf-8"
              )

              old_package = re.search(
                  r'\bpackage="([^"]+)"',
                  text
              )

              split = re.search(
                  r'\bsplit="([^"]+)"',
                  text
              )

              print()
              print(
                  "Manifest:",
                  manifest
              )

              print(
                  "Old package:",
                  old_package.group(1)
                  if old_package
                  else "NOT FOUND"
              )

              print(
                  "Split:",
                  split.group(1)
                  if split
                  else "NOT FOUND"
              )

              if not split:
                  raise SystemExit(
                      f"ERROR: split attribute missing in {manifest}"
                  )

              original_split = split.group(1)

              text, count = re.subn(
                  r'\bpackage="' +
                  re.escape(OLD) +
                  r'"',
                  f'package="{NEW}"',
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: couldn't rename {manifest}"
                  )

              manifest.write_text(
                  text,
                  encoding="utf-8"
              )

              result = manifest.read_text(
                  encoding="utf-8"
              )

              pkg = re.search(
                  r'\bpackage="([^"]+)"',
                  result
              )

              split_after = re.search(
                  r'\bsplit="([^"]+)"',
                  result
              )

              if not pkg or pkg.group(1) != NEW:
                  raise SystemExit(
                      f"ERROR: wrong package in {manifest}"
                  )

              if (
                  not split_after
                  or split_after.group(1)
                  != original_split
              ):
                  raise SystemExit(
                      f"ERROR: split identity changed in {manifest}"
                  )

              print(
                  "New package:",
                  pkg.group(1)
              )

              print(
                  "Preserved split:",
                  split_after.group(1)
              )

          PY

      - name: Add custom effects
        run: |
          set -e

          cp \
            patch/effects/invert-flash.xml \
            decoded-base/assets/effects/invert-flash.xml

          cp \
            patch/effects/gradient-map.xml \
            decoded-base/assets/effects/gradient-map.xml

          cp \
            patch/effects/tv-simulator.xml \
            decoded-base/assets/effects/tv-simulator.xml

      - name: Build cloned base APK
        run: |
          set -e

          java -jar apktool.jar b \
            decoded-base \
            -o base-custom-unsigned.apk

      - name: Compile split manifests to binary XML
        shell: bash
        run: |
          set -e

          mkdir -p compiled-manifests

          compile_manifest () {

            SOURCE="$1"
            TEMP_APK="$2"
            OUTPUT_MANIFEST="$3"

            rm -f "$TEMP_APK"
            rm -f "$OUTPUT_MANIFEST"

            VERSION_ARGS=(
              --version-code "$BASE_VERSION_CODE"
            )

            if [ -n "$BASE_VERSION_NAME" ]; then
              VERSION_ARGS+=(
                --version-name "$BASE_VERSION_NAME"
              )
            fi

            "$BUILD_TOOLS/aapt2" link \
              -o "$TEMP_APK" \
              -I "$ANDROID_PLATFORM/android.jar" \
              --manifest "$SOURCE" \
              --min-sdk-version "$BASE_MIN_SDK" \
              --target-sdk-version "$BASE_TARGET_SDK" \
              "${VERSION_ARGS[@]}"

            unzip -p \
              "$TEMP_APK" \
              AndroidManifest.xml \
              > "$OUTPUT_MANIFEST"

            test -s "$OUTPUT_MANIFEST"

            echo
            echo "Compiled manifest:"
            file "$OUTPUT_MANIFEST"
          }

          compile_manifest \
            decoded-arm64/AndroidManifest.xml \
            compiled-manifests/arm64-temp.apk \
            compiled-manifests/arm64-manifest.bin

          compile_manifest \
            decoded-en/AndroidManifest.xml \
            compiled-manifests/en-temp.apk \
            compiled-manifests/en-manifest.bin

          compile_manifest \
            decoded-xxhdpi/AndroidManifest.xml \
            compiled-manifests/xxhdpi-temp.apk \
            compiled-manifests/xxhdpi-manifest.bin

      - name: Repack original splits with compiled manifests
        shell: bash
        run: |
          set -e

          mkdir -p unsigned-splits

          repack_split () {

            ORIGINAL="$1"
            MANIFEST="$2"
            OUTPUT="$3"

            WORK="$(mktemp -d "$RUNNER_TEMP/split.XXXXXX")"
            OUTPUT_ABS="$GITHUB_WORKSPACE/$OUTPUT"

            # Keep the original archive intact so stored native libraries stay
            # stored. Rebuilding with `zip -r` deflates lib/**/*.so and Android
            # rejects the split when extractNativeLibs is false.
            cp "$ORIGINAL" "$OUTPUT_ABS"

            cp \
              "$MANIFEST" \
              "$WORK/AndroidManifest.xml"

            if zipinfo -1 "$OUTPUT_ABS" | grep -q '^META-INF/'; then
              zip -q -d "$OUTPUT_ABS" 'META-INF/*'
            fi
            zip -q -d "$OUTPUT_ABS" AndroidManifest.xml

            (
              cd "$WORK"
              zip -q -0 "$OUTPUT_ABS" AndroidManifest.xml
            )

            rm -rf "$WORK"
          }

          repack_split \
            split_config.arm64_v8a.apk \
            compiled-manifests/arm64-manifest.bin \
            unsigned-splits/split_config.arm64_v8a.apk

          repack_split \
            split_config.en.apk \
            compiled-manifests/en-manifest.bin \
            unsigned-splits/split_config.en.apk

          repack_split \
            split_config.xxhdpi.apk \
            compiled-manifests/xxhdpi-manifest.bin \
            unsigned-splits/split_config.xxhdpi.apk

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_STORED, ZipFile

          pairs = [
              (Path("split_config.arm64_v8a.apk"), Path("unsigned-splits/split_config.arm64_v8a.apk")),
              (Path("split_config.en.apk"), Path("unsigned-splits/split_config.en.apk")),
              (Path("split_config.xxhdpi.apk"), Path("unsigned-splits/split_config.xxhdpi.apk")),
          ]

          for original_path, rebuilt_path in pairs:
              with ZipFile(original_path) as original, ZipFile(rebuilt_path) as rebuilt:
                  original_entries = {entry.filename: entry for entry in original.infolist()}
                  rebuilt_entries = {entry.filename: entry for entry in rebuilt.infolist()}

                  for name, before in original_entries.items():
                      if name == "AndroidManifest.xml" or name.startswith("META-INF/"):
                          continue
                      after = rebuilt_entries.get(name)
                      if after is None:
                          raise SystemExit(f"ERROR: {rebuilt_path} lost {name}")
                      if (after.CRC, after.file_size, after.compress_size, after.compress_type) != (
                          before.CRC,
                          before.file_size,
                          before.compress_size,
                          before.compress_type,
                      ):
                          raise SystemExit(f"ERROR: {rebuilt_path} changed {name}")

                  native_libraries = [
                      entry for entry in rebuilt_entries.values()
                      if entry.filename.startswith("lib/") and entry.filename.endswith(".so")
                  ]
                  compressed = [entry.filename for entry in native_libraries if entry.compress_type != ZIP_STORED]
                  if compressed:
                      raise SystemExit(
                          f"ERROR: compressed native libraries in {rebuilt_path}: " + ", ".join(compressed)
                      )

                  print(f"Verified preserved ZIP entries: {rebuilt_path}")
                  print(f"Verified stored native libraries: {len(native_libraries)}")
          PY

      - name: Verify unsigned split manifests are binary
        run: |
          set -e

          mkdir -p manifest-check

          for APK in \
            unsigned-splits/split_config.arm64_v8a.apk \
            unsigned-splits/split_config.en.apk \
            unsigned-splits/split_config.xxhdpi.apk
          do

            NAME="$(basename "$APK")"

            unzip -p \
              "$APK" \
              AndroidManifest.xml \
              > "manifest-check/$NAME.xml"

            echo
            echo "===== $APK ====="

            file \
              "manifest-check/$NAME.xml"

            "$BUILD_TOOLS/aapt2" \
              dump xmltree \
              "$APK" \
              AndroidManifest.xml |
              head -30

          done

      - name: Create signing key
        run: |
          set -e

          keytool \
            -genkeypair \
            -keystore patch.keystore \
            -storepass android \
            -keypass android \
            -alias patch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Personal Patch"

      - name: Align and sign all APKs
        shell: bash
        run: |
          set -e

          mkdir -p output
          mkdir -p aligned

          align_sign () {

            INPUT="$1"
            ALIGNED="$2"
            OUTPUT="$3"

            echo
            echo "=== ALIGNING $INPUT ==="

            "$BUILD_TOOLS/zipalign" \
              -f \
              -P 16 \
              4 \
              "$INPUT" \
              "$ALIGNED"

            echo
            echo "=== SIGNING $OUTPUT ==="

            "$BUILD_TOOLS/apksigner" sign \
              --ks patch.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --min-sdk-version "$BASE_MIN_SDK" \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUTPUT" \
              "$ALIGNED"

            echo
            echo "=== VERIFYING SIGNATURE ==="

            "$BUILD_TOOLS/apksigner" verify \
              --min-sdk-version "$BASE_MIN_SDK" \
              --verbose \
              --print-certs \
              "$OUTPUT"

            echo
            echo "=== VERIFYING ALIGNMENT ==="

            "$BUILD_TOOLS/zipalign" \
              -c \
              -P 16 \
              -v \
              4 \
              "$OUTPUT"
          }

          align_sign \
            base-custom-unsigned.apk \
            aligned/base.apk \
            output/base.apk

          align_sign \
            unsigned-splits/split_config.arm64_v8a.apk \
            aligned/split_config.arm64_v8a.apk \
            output/split_config.arm64_v8a.apk

          align_sign \
            unsigned-splits/split_config.en.apk \
            aligned/split_config.en.apk \
            output/split_config.en.apk

          align_sign \
            unsigned-splits/split_config.xxhdpi.apk \
            aligned/split_config.xxhdpi.apk \
            output/split_config.xxhdpi.apk

      - name: Verify all package names
        shell: bash
        run: |
          set -e

          EXPECTED="com.alightcreative.motion.personal"

          for APK in \
            output/base.apk \
            output/split_config.arm64_v8a.apk \
            output/split_config.en.apk \
            output/split_config.xxhdpi.apk
          do

            echo
            echo "===================================="
            echo "$APK"
            echo "===================================="

            "$BUILD_TOOLS/aapt2" \
              dump badging \
              "$APK" |
              head -25

            PACKAGE="$(
              "$BUILD_TOOLS/aapt2" \
                dump badging \
                "$APK" |
              sed -n \
                "s/^package: name='\([^']*\)'.*/\1/p" |
              head -1
            )"

            VERSION_CODE="$(
              "$BUILD_TOOLS/aapt2" \
                dump badging \
                "$APK" |
              sed -n \
                "s/^package:.*versionCode='\([^']*\)'.*/\1/p" |
              head -1
            )"

            echo
            echo "Detected package: $PACKAGE"
            echo "Detected versionCode: $VERSION_CODE"

            if [ "$PACKAGE" != "$EXPECTED" ]; then

              echo "ERROR: package mismatch in $APK"
              exit 1

            fi

            if [ "$VERSION_CODE" != "$BASE_VERSION_CODE" ]; then

              echo "ERROR: versionCode mismatch in $APK"
              exit 1

            fi

          done

      - name: Verify split identities
        shell: bash
        run: |
          set -e

          for PAIR in \
            "split_config.arm64_v8a.apk|output/split_config.arm64_v8a.apk" \
            "split_config.en.apk|output/split_config.en.apk" \
            "split_config.xxhdpi.apk|output/split_config.xxhdpi.apk"
          do

            ORIGINAL="${PAIR%%|*}"
            APK="${PAIR#*|}"

            echo
            echo "===== $APK ====="

            "$BUILD_TOOLS/aapt2" \
              dump xmltree \
              "$APK" \
              AndroidManifest.xml |
              grep -E \
                'package=|split=|configForSplit' \
                || true

            ORIGINAL_SPLIT="$(
              "$BUILD_TOOLS/aapt2" dump badging "$ORIGINAL" |
              sed -n "s/^package:.* split='\([^']*\)'.*/\1/p" |
              head -1
            )"

            OUTPUT_SPLIT="$(
              "$BUILD_TOOLS/aapt2" dump badging "$APK" |
              sed -n "s/^package:.* split='\([^']*\)'.*/\1/p" |
              head -1
            )"

            if [ -z "$ORIGINAL_SPLIT" ] || [ "$OUTPUT_SPLIT" != "$ORIGINAL_SPLIT" ]; then
              echo "ERROR: split identity mismatch in $APK" >&2
              echo "Original: $ORIGINAL_SPLIT" >&2
              echo "Output: $OUTPUT_SPLIT" >&2
              exit 1
            fi

          done

      - name: Verify native libraries are installable
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_STORED, ZipFile

          found = 0
          for apk in sorted(Path("output").glob("*.apk")):
              with ZipFile(apk) as archive:
                  libraries = [
                      entry for entry in archive.infolist()
                      if entry.filename.startswith("lib/") and entry.filename.endswith(".so")
                  ]
                  found += len(libraries)
                  compressed = [entry.filename for entry in libraries if entry.compress_type != ZIP_STORED]
                  if compressed:
                      raise SystemExit(
                          f"ERROR: {apk} contains compressed native libraries: " + ", ".join(compressed)
                      )
                  print(f"{apk}: {len(libraries)} stored native libraries")

          if found == 0:
              raise SystemExit("ERROR: no native libraries found in the split set")
          PY

          "$BUILD_TOOLS/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            output/split_config.arm64_v8a.apk

      - name: Verify custom effects
        run: |
          set -e

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/invert-flash.xml'

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/gradient-map.xml'

          unzip -l \
            output/base.apk |
            grep \
              'assets/effects/tv-simulator.xml'

      - name: Create split bundle
        run: |
          set -e

          cd output

          cat > install.sh <<'EOF'
          #!/bin/sh
          set -eu

          if ! command -v adb >/dev/null 2>&1; then
            echo "ERROR: adb is not installed or is not on PATH." >&2
            exit 1
          fi

          SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

          adb install-multiple -r \
            "$SCRIPT_DIR/base.apk" \
            "$SCRIPT_DIR/split_config.arm64_v8a.apk" \
            "$SCRIPT_DIR/split_config.en.apk" \
            "$SCRIPT_DIR/split_config.xxhdpi.apk"
          EOF

          chmod +x install.sh

          zip \
            -9 \
            Alight.Motion.Custom.split-set.zip \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            install.sh

          echo
          echo "=== OUTPUT FILES ==="
          ls -lh

          echo
          echo "=== SHA256 ==="
          sha256sum \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            Alight.Motion.Custom.split-set.zip

      - name: Upload split set
        uses: actions/upload-artifact@v4
        with:
          name: alight-motion-custom-split-set
          path: |
            output/base.apk
            output/split_config.arm64_v8a.apk
            output/split_config.en.apk
            output/split_config.xxhdpi.apk
            output/install.sh
            output/Alight.Motion.Custom.split-set.zip
          if-no-files-found: error
          retention-days: 3
