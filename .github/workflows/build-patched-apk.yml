name: Build Side-by-Side Alight Motion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patch/effects/**"
      - ".github/workflows/build-patched-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Alight.Motion.apk" \
            --clobber

      - name: Install tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            zip \
            curl \
            openjdk-17-jdk

          curl -L --fail \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

          java -jar apktool.jar --version

      - name: Decode APK
        run: |
          java -jar apktool.jar d \
            -f \
            Alight.Motion.apk \
            -o decoded

      - name: Configure separate app identity
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          manifest_path = Path("decoded/AndroidManifest.xml")

          text = manifest_path.read_text()

          print("Original package:")
          m = re.search(r'\bpackage="([^"]+)"', text)
          print(m.group(1) if m else "NOT FOUND")

          # --------------------------------------------------
          # 1. Preserve relative Android component class names.
          #
          # If manifest package changes:
          #
          #   android:name=".SomeActivity"
          #
          # would otherwise become:
          #
          #   com.alightcreative.motion.personal.SomeActivity
          #
          # But the real class is still:
          #
          #   com.alightcreative.motion.SomeActivity
          #
          # So convert relative component names to absolute
          # original-package names BEFORE changing package.
          # --------------------------------------------------

          android_ns = "http://schemas.android.com/apk/res/android"

          try:
              tree = ET.parse(manifest_path)
              root = tree.getroot()

              name_attr = f"{{{android_ns}}}name"
              target_attr = f"{{{android_ns}}}targetActivity"

              component_tags = {
                  "activity",
                  "activity-alias",
                  "service",
                  "receiver",
                  "provider",
                  "application",
                  "instrumentation",
              }

              changed_names = 0

              for elem in root.iter():
                  tag = elem.tag.split("}")[-1]

                  if tag not in component_tags:
                      continue

                  if name_attr in elem.attrib:
                      name = elem.attrib[name_attr]

                      if name.startswith("."):
                          elem.attrib[name_attr] = OLD + name
                          changed_names += 1

                  if target_attr in elem.attrib:
                      name = elem.attrib[target_attr]

                      if name.startswith("."):
                          elem.attrib[target_attr] = OLD + name
                          changed_names += 1

              ET.register_namespace(
                  "android",
                  android_ns
              )

              tree.write(
                  manifest_path,
                  encoding="utf-8",
                  xml_declaration=True
              )

              print(
                  "Relative component names converted:",
                  changed_names
              )

          except Exception as e:
              print(
                  "XML parser failed, using regex fallback:",
                  e
              )

          # Reload after XML modifications.
          text = manifest_path.read_text()

          # --------------------------------------------------
          # 2. Change actual Android package/application ID.
          # --------------------------------------------------

          text, count = re.subn(
              r'\bpackage="' + re.escape(OLD) + r'"',
              f'package="{NEW}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Failed to change manifest package"
              )

          # --------------------------------------------------
          # 3. Change visible application label.
          # --------------------------------------------------

          text, count = re.subn(
              r'(<application\b[^>]*?\bandroid:label=)"[^"]*"',
              r'\1"Alight Motion Custom"',
              text,
              count=1
          )

          print(
              "Application label replacements:",
              count
          )

          # --------------------------------------------------
          # 4. Avoid permission/provider authority collisions
          # with the official installed Alight Motion.
          # --------------------------------------------------

          text = text.replace(
              "com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              "com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          )

          text = text.replace(
              "com.alightcreative.app.motion.fileprovider",
              "com.alightcreative.app.motion.personal.fileprovider"
          )

          manifest_path.write_text(text)

          # --------------------------------------------------
          # 5. Update exact runtime identity strings in smali.
          #
          # Do NOT rename class descriptors or directories.
          # We only replace literal strings that represent the
          # app's own package/provider identity.
          # --------------------------------------------------

          literal_replacements = {
              '"com.alightcreative.motion"':
                  '"com.alightcreative.motion.personal"',

              '"com.alightcreative.app.motion.fileprovider"':
                  '"com.alightcreative.app.motion.personal.fileprovider"',

              '"com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"':
                  '"com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"',
          }

          changed_smali = 0

          for root in Path("decoded").glob("smali*"):

              if not root.is_dir():
                  continue

              for path in root.rglob("*.smali"):

                  try:
                      old_text = path.read_text()
                  except UnicodeDecodeError:
                      continue

                  new_text = old_text

                  for old, new in literal_replacements.items():
                      new_text = new_text.replace(
                          old,
                          new
                      )

                  if new_text != old_text:
                      path.write_text(new_text)
                      changed_smali += 1

          print(
              "Smali files with package identity literals changed:",
              changed_smali
          )

          # --------------------------------------------------
          # Show final manifest identity.
          # --------------------------------------------------

          final = manifest_path.read_text()

          m = re.search(
              r'\bpackage="([^"]+)"',
              final
          )

          print(
              "Final decoded manifest package:",
              m.group(1) if m else "NOT FOUND"
          )

          if not m:
              raise SystemExit(
                  "ERROR: final manifest package missing"
              )

          if m.group(1) != NEW:
              raise SystemExit(
                  "ERROR: final manifest package incorrect"
              )

          PY

          echo
          echo "=== DECODED MANIFEST PACKAGE ==="

          grep -o \
            'package="[^"]*"' \
            decoded/AndroidManifest.xml |
            head -1

          echo
          echo "=== CUSTOM LABEL ==="

          grep -o \
            'android:label="Alight Motion Custom"' \
            decoded/AndroidManifest.xml |
            head -1

          echo
          echo "=== CUSTOM PROVIDER ==="

          grep -o \
            'com.alightcreative.app.motion.personal.fileprovider' \
            decoded/AndroidManifest.xml |
            head -1

      - name: Add custom effects
        run: |
          set -e

          test -f \
            patch/effects/invert-flash.xml

          test -f \
            patch/effects/gradient-map.xml

          test -f \
            patch/effects/tv-simulator.xml

          cp \
            patch/effects/invert-flash.xml \
            decoded/assets/effects/invert-flash.xml

          cp \
            patch/effects/gradient-map.xml \
            decoded/assets/effects/gradient-map.xml

          cp \
            patch/effects/tv-simulator.xml \
            decoded/assets/effects/tv-simulator.xml

      - name: Build APK
        run: |
          set -e

          java -jar apktool.jar b \
            decoded \
            -o Alight.Motion.Custom-unsigned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          echo "Android build tools:"
          echo "$BUILD_TOOLS"

          keytool \
            -genkeypair \
            -keystore patch.keystore \
            -storepass android \
            -keypass android \
            -alias patch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Personal Patch"

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            Alight.Motion.Custom-unsigned.apk \
            Alight.Motion.Custom-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks patch.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Alight.Motion.Custom.apk \
            Alight.Motion.Custom-aligned.apk

          echo
          echo "=== SIGNATURE ==="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            Alight.Motion.Custom.apk

      - name: Verify package and effects
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          echo
          echo "=== PACKAGE INFO ==="

          "$BUILD_TOOLS/aapt2" \
            dump badging \
            Alight.Motion.Custom.apk |
            head -40

          PACKAGE="$(
            "$BUILD_TOOLS/aapt2" \
              dump badging \
              Alight.Motion.Custom.apk |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo
          echo "Detected package: $PACKAGE"

          if [
            "$PACKAGE" !=
            "com.alightcreative.motion.personal"
          ]; then

            echo
            echo "ERROR: package rename failed"

            exit 1

          fi

          echo
          echo "PACKAGE RENAME SUCCESS"

          echo
          echo "=== APP LABEL ==="

          "$BUILD_TOOLS/aapt2" \
            dump badging \
            Alight.Motion.Custom.apk |
            grep \
              "application-label:'Alight Motion Custom'"

          echo
          echo "=== CUSTOM EFFECTS ==="

          unzip \
            -l \
            Alight.Motion.Custom.apk |
            grep \
              'assets/effects/invert-flash.xml'

          unzip \
            -l \
            Alight.Motion.Custom.apk |
            grep \
              'assets/effects/gradient-map.xml'

          unzip \
            -l \
            Alight.Motion.Custom.apk |
            grep \
              'assets/effects/tv-simulator.xml'

          echo
          echo "=== EFFECT NAME CHECK ==="

          unzip \
            -p \
            Alight.Motion.Custom.apk \
            assets/effects/invert-flash.xml |
            grep -F \
              "Invert Flash"

          unzip \
            -p \
            Alight.Motion.Custom.apk \
            assets/effects/gradient-map.xml |
            grep -F \
              "Gradient Map"

          unzip \
            -p \
            Alight.Motion.Custom.apk \
            assets/effects/tv-simulator.xml |
            grep -F \
              "TV Simulator"

          echo
          echo "=== APK ZIP INTEGRITY ==="

          unzip \
            -tq \
            Alight.Motion.Custom.apk

          echo
          echo "=== SHA256 ==="

          sha256sum \
            Alight.Motion.Custom.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alight-motion-custom-side-by-side
          path: Alight.Motion.Custom.apk
          retention-days: 3
