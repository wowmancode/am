name: Report on anxyis patches

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / commit of anxyis/anxy-patches to analyze"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download anxyis/anxy-patches zip
        shell: bash
        run: |
          set -e

          REF="${{ inputs.ref || 'main' }}"
          echo "Fetching anxyis/anxy-patches@$REF"

          mkdir -p anxyis

          # Works for public repos without auth.
          # If the repo is private, set the PATCHES_TOKEN secret to a PAT
          # with repo scope and uncomment the Authorization header below.
          curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -o anxyis/patches.zip \
            "https://github.com/anxyis/anxy-patches/archive/refs/heads/$REF.zip"

          ls -lh anxyis/patches.zip
          file anxyis/patches.zip

          unzip -q anxyis/patches.zip -d anxyis/extracted

          SRC="$(find anxyis/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "::error::zip did not contain a top-level directory"
            exit 1
          fi

          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Extracted to: $SRC"

      - name: Install report tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep xmlstarlet

      - name: Build report
        shell: bash
        run: |
          set -e
          mkdir -p report

          {
            echo "=== SOURCE ==="
            echo "Repo: anxyis/anxy-patches"
            echo "Ref:  ${{ inputs.ref || 'main' }}"
            echo "Size on disk: $(du -sh "$SRC" | cut -f1)"
            echo

            echo "=== TOP-LEVEL TREE ==="
            find "$SRC" -maxdepth 3 -type d -not -path '*/.git/*' | sort
            echo

            echo "=== KOTLIN PATCH FILES ==="
            find "$SRC" -type f -name '*.kt' -not -path '*/build/*' | sort
            echo

            echo "=== PATCH FILE COUNT ==="
            find "$SRC" -type f -name '*.kt' -not -path '*/build/*' | wc -l
            echo

            echo "=== PATCH NAMES / DESCRIPTIONS ==="
            # Pull name= and description= out of every bytecodePatch(...) block.
            rg -n --no-heading -g '*.kt' -g '!**/build/**' \
              'bytecodePatch\(|name\s*=\s*"|description\s*=\s*"' \
              "$SRC" | head -3000
            echo

            echo "=== COMPATIBILITY / TARGETS ==="
            rg -n --no-heading -g '*.kt' -g '!**/build/**' \
              'Compatibility\(|packageName\s*=|versionCode\s*=|version\s*=\s*"|AppTarget' \
              "$SRC" | head -1000
            echo

            echo "=== BUILD CONFIG FILES ==="
            for f in settings.gradle.kts build.gradle.kts gradle.properties \
                     patches/build.gradle.kts build.gradle; do
              if [ -f "$SRC/$f" ]; then
                echo "----- $f -----"
                sed -n '1,200p' "$SRC/$f"
                echo
              fi
            done

            echo "=== XML / JSON / RESOURCES ==="
            find "$SRC" -type f \( -name '*.xml' -o -name '*.json' \) \
              -not -path '*/build/*' -not -path '*/.git/*' \
              | sort | head -500
            echo

            echo "=== BUNDLED SMALI / TEXT BODIES ==="
            find "$SRC" -type d -name 'resources' -not -path '*/build/*' \
              -print -exec sh -c 'find "$1" -type f | head -200' _ {} \;
          } > report/anxyis-patches-report.txt

          # Flat file lists for easy review
          find "$SRC" -type f -not -path '*/build/*' -not -path '*/.git/*' \
            | sed "s|^$SRC/||" | sort > report/all-files.txt
          find "$SRC" -type f -name '*.kt' -not -path '*/build/*' \
            | sed "s|^$SRC/||" | sort > report/kotlin-files.txt

          wc -l report/*.txt
          echo
          echo "===== FIRST 120 LINES OF REPORT ====="
          head -120 report/anxyis-patches-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: anxyis-patches-report
          path: report/
          retention-days: 30
          if-no-files-found: error
